components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ─── Company ───
    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        legalForm:
          type: string
        country:
          type: string
        taxRegime:
          type: string
          description: "One of: vat, gst, none"
        taxNumber:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        bankDetails:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        currency:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - legalForm
        - country
        - taxRegime
        - currency
        - isActive
        - createdAt
        - updatedAt

    CreateCompanyBody:
      type: object
      properties:
        name:
          type: string
        legalForm:
          type: string
        country:
          type: string
        taxRegime:
          type: string
        taxNumber:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        bankDetails:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        currency:
          type: string
      required:
        - name
        - legalForm
        - country
        - taxRegime
        - currency

    UpdateCompanyBody:
      type: object
      properties:
        name:
          type: string
        legalForm:
          type: string
        country:
          type: string
        taxRegime:
          type: string
        taxNumber:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        bankDetails:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        currency:
          type: string
        isActive:
          type: boolean

    # ─── User ───
    User:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          description: "One of: admin, germany_accountant, india_accountant, project_manager, client, freelancer"
        isActive:
          type: boolean
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clerkUserId
        - email
        - role
        - isActive
        - companies
        - createdAt
        - updatedAt

    CreateUserBody:
      type: object
      description: >
        All fields are optional hints. Identity (email, name, role) is always
        derived server-side from the Clerk auth token. Client-provided values
        are ignored for security.
      properties:
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]

    AdminCreateUserBody:
      type: object
      description: >
        Pre-register a user before they sign up. Email is required; the Clerk
        account will be linked automatically when the user first signs in.
      properties:
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          description: "One of: admin, germany_accountant, india_accountant, project_manager, client, freelancer"
      required:
        - email

    UpdateUserBody:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
        isActive:
          type: boolean

    UserCompanyAssignment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        companyId:
          type: integer
        company:
          $ref: "#/components/schemas/Company"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - companyId
        - company
        - createdAt

    AssignUserToCompanyBody:
      type: object
      properties:
        companyId:
          type: integer
      required:
        - companyId

    # ─── Dashboard ───
    DashboardStats:
      type: object
      properties:
        totalCompanies:
          type: integer
        totalUsers:
          type: integer
        usersByRole:
          type: array
          items:
            $ref: "#/components/schemas/RoleCount"
        companiesByCountry:
          type: array
          items:
            $ref: "#/components/schemas/CountryCount"
      required:
        - totalCompanies
        - totalUsers
        - usersByRole
        - companiesByCountry

    RoleCount:
      type: object
      properties:
        role:
          type: string
        count:
          type: integer
      required:
        - role
        - count

    CountryCount:
      type: object
      properties:
        country:
          type: string
        count:
          type: integer
      required:
        - country
        - count

    # ─── Projects ───
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: "One of: one_time, monthly_fixed, amc, internal"
        companyId:
          type: integer
        clientId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
          description: "One of: active, completed, on_hold"
        billingModel:
          type: string
          description: "One of: hourly, fixed, retainer"
        fixedAllocationHours:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        company:
          $ref: "#/components/schemas/Company"
        client:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserBasic"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - companyId
        - status
        - billingModel
        - company
        - createdAt
        - updatedAt

    UserBasic:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
      required:
        - id
        - email
        - role

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          description: "One of: one_time, monthly_fixed, amc, internal"
        companyId:
          type: integer
        clientId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
          description: "One of: active, completed, on_hold"
        billingModel:
          type: string
          description: "One of: hourly, fixed, retainer"
        fixedAllocationHours:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
      required:
        - name
        - type
        - companyId
        - billingModel

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        companyId:
          type: integer
        clientId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
        billingModel:
          type: string
        fixedAllocationHours:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]

    ProjectAssignment:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        userId:
          type: integer
        memberType:
          type: string
          description: "One of: employee, freelancer"
        hourlyRate:
          type: ["string", "null"]
        monthlyRate:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/UserBasic"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - userId
        - memberType
        - user
        - createdAt

    CreateProjectAssignmentBody:
      type: object
      properties:
        userId:
          type: integer
        memberType:
          type: string
          description: "One of: employee, freelancer"
        hourlyRate:
          type: ["string", "null"]
        monthlyRate:
          type: ["string", "null"]
      required:
        - userId
        - memberType

    BillingSummary:
      type: object
      properties:
        projectId:
          type: integer
        month:
          type: string
        fixedAllocationHours:
          type: ["string", "null"]
        loggedHours:
          type: string
        remainingHours:
          type: ["string", "null"]
        memberBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MemberHoursSummary"
      required:
        - projectId
        - month
        - loggedHours
        - memberBreakdown

    MemberHoursSummary:
      type: object
      properties:
        userId:
          type: integer
        userName:
          type: string
        loggedHours:
          type: string
      required:
        - userId
        - userName
        - loggedHours

    # ─── Time Entries ───
    TimeEntry:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        userId:
          type: integer
        date:
          type: string
        hours:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - userId
        - date
        - hours
        - createdAt
        - updatedAt

    TimeEntryWithProject:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        userId:
          type: integer
        date:
          type: string
        hours:
          type: string
        description:
          type: ["string", "null"]
        projectName:

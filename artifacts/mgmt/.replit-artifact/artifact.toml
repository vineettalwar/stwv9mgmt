kind = "web"
previewPath = "/"
title = "STWV Management Platform"
version = "1.0.0"
id = "artifacts/mgmt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23869

[services.development]
run = "pnpm --filter @workspace/mgmt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mgmt", "run", "build" ]
publicDir = "artifacts/mgmt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23869"
BASE_PATH = "/"
